services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcontour-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CORS_ORIGIN=*
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_DEVICE_ID=${DEFAULT_DEVICE_ID:-SMARTCONTOUR-001}
    volumes:
      - ./knowledge:/knowledge:ro
    networks:
      - smartcontour-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcontour-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - smartcontour-net

networks:
  smartcontour-net:
    driver: bridge
